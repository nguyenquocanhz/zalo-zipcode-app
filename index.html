<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Tra cứu bưu chính và giá xăng By Wren</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem("zma_zipcode_theme") || "light";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <script>
      (function() {
        try {
          var t = localStorage.getItem("zma_zipcode_theme") || "light";
          document.body.setAttribute("zaui-theme", t);
        } catch (e) {}
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/app.jsx"></script>
  </body>
</html>

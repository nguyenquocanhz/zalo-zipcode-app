name: Auto Update Petroleum Prices

on:
  schedule:
    # Kỳ điều hành chiều Thứ Năm: 15:10, 15:40, 16:30, 18:00 giờ VN (UTC+7)
    - cron: "10,40 8 * * 4"
    - cron: "30 9 * * 4"
    - cron: "0 11 * * 4"
    # Quét dự phòng mỗi sáng 07:30 giờ VN (kỳ điều chỉnh bất thường, lần chạy trước lỗi)
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Chạy lại kể cả khi feed đã là kỳ mới nhất"
        type: boolean
        default: false
      manual:
        description: "Nhập tay khi OCR lỗi, vd: ron95_3=27180,e5_ron92=26560,diesel_2=29710 (bỏ trống để tự động)"
        required: false
        default: ""
      date:
        description: "Ngày hiệu lực DD/MM/YYYY (bắt buộc khi nhập tay)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: gas-price-updater
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/gas-updater/package-lock.json

      - name: Cài updater
        run: npm ci --prefix scripts/gas-updater

      - name: Cache dữ liệu OCR (tessdata)
        uses: actions/cache@v4
        with:
          path: /tmp/wrenapp-tessdata
          key: tessdata-vie-eng-v1

      - name: Cập nhật giá từ thông cáo Petrolimex
        id: update
        env:
          INPUT_FORCE: ${{ github.event.inputs.force }}
          INPUT_MANUAL: ${{ github.event.inputs.manual }}
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          args=()
          if [ "$INPUT_FORCE" = "true" ]; then args+=(--force); fi
          if [ -n "$INPUT_MANUAL" ]; then args+=(--manual "$INPUT_MANUAL" --date "$INPUT_DATE"); fi
          node scripts/gas-updater/update.js "${args[@]}"

      - name: Commit và push
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gas-price-latest.json
          if git diff --staged --quiet; then
            echo "Không có thay đổi để commit."
            exit 0
          fi
          git commit -m "chore(gas): giá xăng dầu kỳ ${{ steps.update.outputs.effective_date }} [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            sleep 5
          done

      - name: Xoá cache jsDelivr
        if: steps.update.outputs.changed == 'true'
        run: curl -fsS -m 30 "https://purge.jsdelivr.net/gh/${{ github.repository }}@${{ github.ref_name }}/gas-price-latest.json" || echo "Purge jsDelivr lỗi, CDN sẽ tự làm mới sau tối đa 12 giờ."

      - name: Báo backend đồng bộ ngay
        if: steps.update.outputs.changed == 'true' && vars.BACKEND_REFRESH_URL != ''
        run: curl -fsS -m 20 -X POST "${{ vars.BACKEND_REFRESH_URL }}" || echo "Backend không phản hồi, nó sẽ tự đồng bộ theo lịch."
